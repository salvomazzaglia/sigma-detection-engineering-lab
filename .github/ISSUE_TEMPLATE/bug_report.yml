name: Bug report
description: Report a defect in the offline detection lab
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include real logs, credentials, SIEM exports, or organization data.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Offline commands only
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: synthetic
    attributes:
      label: Data used
      options:
        - Synthetic fixtures only
        - Other (describe without real data)
    validations:
      required: true
