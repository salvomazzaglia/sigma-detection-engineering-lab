name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.os }} / Py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: python -m ruff check src tests scripts

      - name: Ruff format
        run: python -m ruff format --check src tests scripts

      - name: mypy
        run: python -m mypy src

      - name: pytest
        run: python -m pytest -q --tb=short

      - name: Validate rules (includes behavioral tests and conversion)
        run: >
          python -m sigma_detection_engineering_lab validate
          --rules rules
          --metadata metadata/rules
          --strict
          --json-out temp/ci-quality.json
          --html-out temp/ci-quality.html
          --sarif-out temp/ci-quality.sarif
          --junit-out temp/ci-tests.xml

      - name: Coverage report
        run: >
          python -m sigma_detection_engineering_lab coverage
          --tests
          --json-out temp/ci-coverage.json
          --html-out temp/ci-coverage.html
          --navigator temp/ci-navigator.json

      - name: Convert Splunk (demo)
        run: >
          python -m sigma_detection_engineering_lab convert
          --backend splunk
          --output temp/ci-conversions-splunk.json

      - name: Convert Elasticsearch Lucene (demo)
        run: >
          python -m sigma_detection_engineering_lab convert
          --backend elasticsearch-lucene
          --output temp/ci-conversions-elasticsearch.json

      - name: Upstream catalog offline check
        run: python scripts/validate-upstream-catalog.py

      - name: Build package
        run: python -m build
