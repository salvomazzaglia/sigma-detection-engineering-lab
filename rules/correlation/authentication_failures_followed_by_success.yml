title: 'Windows Logon Failure (Correlation Input)'
id: b659e109-4522-5d95-a665-0104622f6ff0
name: sdel_cor_001_windows_logon_failure
status: experimental
description: >-
    Base rule that selects Windows logon failure records for use by the authentication
    failure correlation rules.
references:
    - 'https://attack.mitre.org/techniques/T1110/001/'
    - 'https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10-security-auditing/event-4625'
    - 'https://sigmahq.io/sigma-specification/specification/sigma-correlation-rules-specification.html'
author: 'Salvatore Mazzaglia'
date: 2026-08-01
tags:
    - attack.credential-access
    - attack.t1110.001
logsource:
    product: windows
    service: security
detection:
    selection_logon_failure:
        EventID: 4625
    condition: selection_logon_failure
falsepositives:
    - >-
        Ordinary password mistyping by interactive users on shared workstations, typically
        one or two failures immediately followed by a success.
    - >-
        Scheduled tasks and services running with a stored credential that was not updated
        after a password rotation.
level: informational
license: MIT
---
title: 'Windows Logon Success (Correlation Input)'
id: 9e678e21-6461-54a2-8c0b-9622a6d0be75
name: sdel_cor_001_windows_logon_success
status: experimental
description: >-
    Base rule that selects successful Windows logon records for use by the authentication
    failure correlation rules.
references:
    - 'https://attack.mitre.org/techniques/T1110/001/'
    - 'https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10-security-auditing/event-4625'
    - 'https://sigmahq.io/sigma-specification/specification/sigma-correlation-rules-specification.html'
author: 'Salvatore Mazzaglia'
date: 2026-08-01
tags:
    - attack.credential-access
    - attack.t1110.001
logsource:
    product: windows
    service: security
detection:
    selection_logon_success:
        EventID: 4624
    condition: selection_logon_success
falsepositives:
    - >-
        All normal interactive and network logons across the estate, which is why this base
        rule is never alerted on directly.
    - >-
        Service account logons generated by scheduled workloads and by management agents
        polling on a fixed interval.
level: informational
license: MIT
---
title: 'Authentication Failures Followed By A Successful Logon'
id: 0f097239-cd26-5f9d-b6a5-d091141f6a15
status: experimental
description: >-
    Correlates Windows logon failures with a subsequent successful logon for the same
    account inside a fifteen minute window. The ordered sequence distinguishes a guessing
    attempt that eventually worked from ordinary isolated failures.
references:
    - 'https://attack.mitre.org/techniques/T1110/001/'
    - 'https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10-security-auditing/event-4625'
    - 'https://sigmahq.io/sigma-specification/specification/sigma-correlation-rules-specification.html'
author: 'Salvatore Mazzaglia'
date: 2026-08-01
tags:
    - attack.credential-access
    - attack.t1110.001
correlation:
    type: temporal_ordered
    rules:
        - sdel_cor_001_windows_logon_failure
        - sdel_cor_001_windows_logon_success
    group-by:
        - TargetUserName
    timespan: 15m
falsepositives:
    - >-
        A user mistyping a password several times after a scheduled password rotation and
        then signing in successfully from the same workstation.
    - >-
        An application service restarting with a stale cached credential, failing, and then
        succeeding once an operator updates the stored secret.
level: medium
license: MIT
