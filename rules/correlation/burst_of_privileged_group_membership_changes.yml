title: 'Privileged Group Member Addition (Correlation Input)'
id: 7add6c92-9efa-5594-871d-4b7544f1f465
name: sdel_cor_004_privileged_group_addition
status: experimental
description: >-
    Base rule that selects additions to privileged groups for use by the privilege
    consolidation correlation rule.
references:
    - 'https://attack.mitre.org/techniques/T1098/'
    - 'https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10-security-auditing/event-4728'
    - 'https://sigmahq.io/sigma-specification/specification/sigma-correlation-rules-specification.html'
author: 'Salvatore Mazzaglia'
date: 2026-08-01
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1098
logsource:
    product: windows
    service: security
detection:
    selection_member_added:
        EventID:
            - 4728
            - 4732
            - 4756
    selection_privileged_group:
        TargetUserName:
            - 'Domain Admins'
            - 'Enterprise Admins'
            - 'Schema Admins'
            - Administrators
    condition: 'selection_member_added and selection_privileged_group'
falsepositives:
    - >-
        Just-in-time privileged access grants issued by governance automation and reversed
        automatically when the grant expires.
    - >-
        Onboarding of new operations engineers during a documented change window, which
        produces several additions in quick succession.
level: informational
license: MIT
---
title: 'Burst Of Privileged Group Membership Changes By One Subject'
id: ae231f02-7a3b-5623-901f-780b32202ee5
status: experimental
description: >-
    Counts privileged group membership additions performed by a single subject within ten
    minutes. Rapid bulk changes suggest scripted privilege consolidation rather than a
    considered administrative action.
references:
    - 'https://attack.mitre.org/techniques/T1098/'
    - 'https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10-security-auditing/event-4728'
    - 'https://sigmahq.io/sigma-specification/specification/sigma-correlation-rules-specification.html'
author: 'Salvatore Mazzaglia'
date: 2026-08-01
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1098
correlation:
    type: event_count
    rules:
        - sdel_cor_004_privileged_group_addition
    group-by:
        - SubjectUserName
    timespan: 10m
    condition:
        gte: 4
falsepositives:
    - >-
        Bulk onboarding of a new operations team where several engineers are added to the
        same administrative group during one change window.
    - >-
        Directory migration tooling that recreates group membership in bulk after a
        consolidation project.
level: high
license: MIT
