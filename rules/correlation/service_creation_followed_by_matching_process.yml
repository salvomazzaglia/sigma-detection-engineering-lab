title: 'Service Installation Record (Correlation Input)'
id: cbf60d2e-15aa-5481-9437-85789151552e
name: sdel_cor_005_service_created
status: experimental
description: >-
    Base rule that selects service installation records for use by the service execution
    correlation rule.
references:
    - 'https://attack.mitre.org/techniques/T1543/003/'
    - 'https://learn.microsoft.com/en-us/windows/win32/services/service-control-manager'
    - 'https://sigmahq.io/sigma-specification/specification/sigma-correlation-rules-specification.html'
author: 'Salvatore Mazzaglia'
date: 2026-08-01
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1543.003
logsource:
    product: windows
    service: system
detection:
    selection_service_installed:
        EventID: 7045
        Provider_Name: 'Service Control Manager'
    condition: selection_service_installed
falsepositives:
    - >-
        Managed endpoint agent installation during server provisioning, which registers one
        or more services in a single burst.
    - >-
        Vendor installers registering supporting services such as licensing or telemetry
        helpers at the end of a setup sequence.
level: informational
license: MIT
