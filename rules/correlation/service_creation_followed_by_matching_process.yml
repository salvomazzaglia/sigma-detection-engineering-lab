title: 'Process Creation Record (Correlation Input)'
id: 3602d72b-5450-553d-8881-9bdeaa6e38b0
name: sdel_cor_005_process_started
status: experimental
description: >-
    Base rule that selects process creation records with an absolute image path for use by
    the service execution correlation rule.
references:
    - 'https://attack.mitre.org/techniques/T1543/003/'
    - 'https://learn.microsoft.com/en-us/windows/win32/services/service-control-manager'
    - 'https://sigmahq.io/sigma-specification/specification/sigma-correlation-rules-specification.html'
author: 'Salvatore Mazzaglia'
date: 2026-08-01
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1543.003
logsource:
    category: process_creation
    product: windows
detection:
    selection_process_started:
        Image|contains: '\'
    condition: selection_process_started
falsepositives:
    - >-
        All ordinary process creation on the endpoint, which is why this base rule is only
        meaningful inside the correlation.
    - >-
        Management agent child processes started continuously by inventory and patching
        workflows.
level: informational
license: MIT
---
title: 'Service Creation Followed By Execution Of The Same Binary'
id: f525f1d0-6aae-5b68-b3ba-6542da9cfe5f
status: experimental
description: >-
    Correlates a service installation with the subsequent execution of the same binary on
    the same host. Observing both halves confirms that the installed service actually ran,
    which separates real persistence from an abandoned artefact.
references:
    - 'https://attack.mitre.org/techniques/T1543/003/'
    - 'https://learn.microsoft.com/en-us/windows/win32/services/service-control-manager'
    - 'https://sigmahq.io/sigma-specification/specification/sigma-correlation-rules-specification.html'
author: 'Salvatore Mazzaglia'
date: 2026-08-01
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1543.003
correlation:
    type: temporal_ordered
    rules:
        - sdel_cor_005_service_created
        - sdel_cor_005_process_started
    aliases:
        service_binary:
            sdel_cor_005_service_created: ImagePath
            sdel_cor_005_process_started: Image
    group-by:
        - Computer
        - service_binary
    timespan: 10m
falsepositives:
    - >-
        Legitimate agent installation where the installer registers the service and then
        starts it immediately, which produces the same ordered pair.
    - >-
        Server build automation installing and starting several platform services during
        provisioning.
level: medium
license: MIT
