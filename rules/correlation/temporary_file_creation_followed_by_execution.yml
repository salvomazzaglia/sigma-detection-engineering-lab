title: 'Process Launched From A Writable Directory (Correlation Input)'
id: 0d23f62b-4522-54ef-998d-9ae0e74736b4
name: sdel_cor_006_executable_launched
status: experimental
description: >-
    Base rule that selects process creation from user-writable directories for use by the
    staging correlation rule.
references:
    - 'https://attack.mitre.org/techniques/T1105/'
    - 'https://attack.mitre.org/techniques/T1204/002/'
    - 'https://sigmahq.io/sigma-specification/specification/sigma-correlation-rules-specification.html'
author: 'Salvatore Mazzaglia'
date: 2026-08-01
tags:
    - attack.command-and-control
    - attack.t1105
    - attack.t1204.002
logsource:
    category: process_creation
    product: windows
detection:
    selection_writable_directory:
        Image|contains:
            - '\AppData\Local\Temp\'
            - '\Windows\Temp\'
            - '\Users\Public\'
    condition: selection_writable_directory
falsepositives:
    - >-
        Installer setup binaries running from the temporary directory immediately after
        extraction.
    - >-
        Test harnesses executed from a build workspace by continuous integration jobs on
        build agents.
level: informational
license: MIT
