title: 'Executable Written To A Writable Directory (Correlation Input)'
id: 12eb1201-94b2-56c0-b7f8-20a8f79e23a3
name: sdel_cor_006_executable_written
status: experimental
description: >-
    Base rule that selects executable file creation in user-writable directories for use by
    the staging correlation rule.
references:
    - 'https://attack.mitre.org/techniques/T1105/'
    - 'https://attack.mitre.org/techniques/T1204/002/'
    - 'https://sigmahq.io/sigma-specification/specification/sigma-correlation-rules-specification.html'
author: 'Salvatore Mazzaglia'
date: 2026-08-01
tags:
    - attack.command-and-control
    - attack.t1105
    - attack.t1204.002
logsource:
    category: file_event
    product: windows
detection:
    selection_writable_directory:
        TargetFilename|contains:
            - '\AppData\Local\Temp\'
            - '\Windows\Temp\'
            - '\Users\Public\'
    selection_executable_extension:
        TargetFilename|endswith:
            - '.exe'
            - '.dll'
    condition: 'selection_writable_directory and selection_executable_extension'
falsepositives:
    - >-
        Installer packages extracting their payload binaries into the per-user temporary
        directory before running setup.
    - >-
        Compilers and packaging tools writing build output into a temporary workspace on
        developer and build hosts.
level: informational
license: MIT
