title: 'Executable Written To A Temporary Path And Then Executed'
id: c162ff7a-b81d-5a1f-847d-1690a4412562
status: experimental
description: >-
    Correlates the creation of an executable in a user-writable directory with the execution
    of that same file on the same host within five minutes. The pair is far more specific
    than either half alone, which is why the file creation rule on its own is rated low.
references:
    - 'https://attack.mitre.org/techniques/T1105/'
    - 'https://attack.mitre.org/techniques/T1204/002/'
    - 'https://sigmahq.io/sigma-specification/specification/sigma-correlation-rules-specification.html'
author: 'Salvatore Mazzaglia'
date: 2026-08-01
tags:
    - attack.command-and-control
    - attack.t1105
    - attack.t1204.002
correlation:
    type: temporal_ordered
    rules:
        - sdel_cor_006_executable_written
        - sdel_cor_006_executable_launched
    aliases:
        artifact_path:
            sdel_cor_006_executable_written: TargetFilename
            sdel_cor_006_executable_launched: Image
    group-by:
        - Computer
        - artifact_path
    timespan: 5m
falsepositives:
    - >-
        Installer packages that extract a setup executable into the temporary directory and
        immediately run it.
    - >-
        Build pipelines that compile a binary into a temporary workspace and execute the
        resulting test harness.
level: high
license: MIT
