title: 'Group Policy Object Modified In The Policies Container'
id: 7260ce80-c072-5dcd-982b-9d4954116da6
status: experimental
description: >-
    Detects modification of an object inside the group policy container. Group policy is a
    domain-wide configuration and code distribution channel, so unplanned changes deserve
    review.
references:
    - 'https://attack.mitre.org/techniques/T1484/001/'
    - 'https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10-security-auditing/event-5136'
    - 'https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/component-updates/group-policy-basics'
author: 'Salvatore Mazzaglia'
date: 2026-08-01
tags:
    - attack.privilege-escalation
    - attack.defense-evasion
    - attack.t1484.001
logsource:
    product: windows
    service: security
detection:
    selection_directory_change:
        EventID: 5136
    selection_policy_container:
        ObjectDN|contains: 'CN=Policies,CN=System'
    selection_value_written:
        OperationType:
            - 'Value Added'
            - '%%14674'
    condition: 'selection_directory_change and selection_policy_container and selection_value_written'
falsepositives:
    - >-
        Planned policy edits by the platform team during a change window, typically
        clustered within a short period on the same policy object.
    - >-
        Configuration baseline tooling that updates a managed policy version stamp on a
        regular schedule.
level: medium
license: MIT
