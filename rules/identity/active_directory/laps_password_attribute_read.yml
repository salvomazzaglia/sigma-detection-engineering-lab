title: 'Local Administrator Password Solution Attribute Read'
id: b1cd7602-1dcb-556e-8fef-617fe9c56499
status: experimental
description: >-
    Detects directory object access that reads the managed local administrator password
    attribute. Reads are legitimate for help desk staff, so the rule is intended for review
    of who reads which computer objects and how often.
references:
    - 'https://attack.mitre.org/techniques/T1555/'
    - 'https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10-security-auditing/event-4662'
    - 'https://learn.microsoft.com/en-us/windows-server/identity/laps/laps-overview'
author: 'Salvatore Mazzaglia'
date: 2026-08-01
tags:
    - attack.credential-access
    - attack.t1555
logsource:
    product: windows
    service: security
detection:
    selection_object_access:
        EventID: 4662
    selection_password_attribute:
        Properties|contains:
            - ms-Mcs-AdmPwd
            - msLAPS-Password
            - msLAPS-EncryptedPassword
    condition: 'selection_object_access and selection_password_attribute'
falsepositives:
    - >-
        Help desk staff retrieving the managed local administrator password to support a
        user during an approved remote assistance session.
    - >-
        Endpoint management tooling reading the attribute to validate password rotation
        compliance across the fleet.
level: low
license: MIT
