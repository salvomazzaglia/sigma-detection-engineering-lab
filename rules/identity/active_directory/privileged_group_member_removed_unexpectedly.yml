title: 'Member Removed From A Privileged Group Outside Governance Automation'
id: f33cdb9a-15f7-5da7-a825-918283fd0dbd
status: experimental
description: >-
    Detects removal of a member from a privileged group by a subject other than the identity
    governance service. Unexpected removals can indicate an attempt to hide prior activity
    or to disrupt administrative response.
references:
    - 'https://attack.mitre.org/techniques/T1098/'
    - 'https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10-security-auditing/event-4729'
author: 'Salvatore Mazzaglia'
date: 2026-08-01
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1098
logsource:
    product: windows
    service: security
detection:
    selection_member_removed:
        EventID:
            - 4729
            - 4733
            - 4757
    selection_privileged_group:
        TargetUserName:
            - 'Domain Admins'
            - 'Enterprise Admins'
            - 'Schema Admins'
            - Administrators
    filter_governance_service:
        SubjectUserName: synthetic-service-iam
    condition: 'selection_member_removed and selection_privileged_group and not filter_governance_service'
falsepositives:
    - >-
        Identity governance automation expiring a time-bound grant, which the service
        account filter removes.
    - >-
        Quarterly access recertification campaigns where reviewers remove stale members in
        bulk over a short period.
level: medium
license: MIT
