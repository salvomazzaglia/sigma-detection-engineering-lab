title: 'Administrative Password Reset Targeting A Privileged Account'
id: 20ce2978-8a1f-5689-9ff6-a10725dbc9c5
status: experimental
description: >-
    Detects an administrative password reset performed against a privileged synthetic
    account. Resetting a privileged credential grants immediate access and locks out the
    legitimate owner.
references:
    - 'https://attack.mitre.org/techniques/T1098/'
    - 'https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10-security-auditing/event-4724'
author: 'Salvatore Mazzaglia'
date: 2026-08-01
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1098
logsource:
    product: windows
    service: security
detection:
    selection_admin_reset:
        EventID: 4724
    selection_privileged_target:
        TargetUserName:
            - synthetic-admin
            - synthetic-da-admin
            - synthetic-breakglass
    condition: 'selection_admin_reset and selection_privileged_target'
falsepositives:
    - >-
        Scheduled break-glass credential rotation performed by the privileged access
        management platform on a documented cadence.
    - >-
        Help desk resets for administrators who have been locked out after a device rebuild
        or a lost authenticator.
level: high
license: MIT
