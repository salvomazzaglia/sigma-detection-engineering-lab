title: 'User Account Created'
id: 16e551df-c267-5b7e-af52-e3c5666bcf43
status: experimental
description: >-
    Detects account creation recorded in the Security log. Account creation is a normal
    administrative action, so this rule provides baseline visibility and correlation input
    rather than a standalone alert.
references:
    - 'https://attack.mitre.org/techniques/T1136/001/'
    - 'https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10-security-auditing/event-4720'
author: 'Salvatore Mazzaglia'
date: 2026-08-01
tags:
    - attack.persistence
    - attack.t1136.001
logsource:
    product: windows
    service: security
detection:
    selection_account_created:
        EventID: 4720
    filter_provisioning_service:
        SubjectUserName: synthetic-service-provisioning
    condition: 'selection_account_created and not filter_provisioning_service'
falsepositives:
    - >-
        Joiner automation from the human resources system creating accounts in batches every
        morning, which the provisioning service filter removes.
    - >-
        Service account creation performed by platform engineers during an application
        onboarding project.
    - >-
        Test account creation in a pre-production directory that shares the same audit
        pipeline.
level: low
license: MIT
