title: 'Sudoers Configuration File Modified'
id: 06345aa3-0469-5fd9-9ebd-f2651f850181
status: experimental
description: >-
    Detects writes to the privilege escalation configuration file or its include directory.
    A single line in these files can grant permanent passwordless root access.
references:
    - 'https://attack.mitre.org/techniques/T1548/003/'
    - 'https://man7.org/linux/man-pages/man5/sudoers.5.html'
author: 'Salvatore Mazzaglia'
date: 2026-08-01
tags:
    - attack.privilege-escalation
    - attack.defense-evasion
    - attack.t1548.003
logsource:
    category: file_event
    product: linux
detection:
    selection_sudoers_path:
        TargetFilename|startswith:
            - '/etc/sudoers'
            - '/etc/sudoers.d/'
    filter_package_manager:
        Image:
            - '/usr/bin/dpkg'
            - '/usr/bin/rpm'
    condition: 'selection_sudoers_path and not filter_package_manager'
falsepositives:
    - >-
        Configuration management applying an approved privilege template to a server role,
        which appears as a write to a file in the include directory.
    - >-
        Package installation that ships its own privilege fragment, which the package
        manager filter removes.
level: high
license: MIT
