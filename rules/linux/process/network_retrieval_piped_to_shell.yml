title: 'Network Retrieval Command Piped Directly To A Shell'
id: b823f46c-f765-50b0-91a9-1f6f9fb9627a
status: experimental
description: >-
    Detects a command line that retrieves remote content and pipes it straight into a shell
    interpreter. The pattern executes remote code without ever writing a reviewable file to
    disk.
references:
    - 'https://attack.mitre.org/techniques/T1059/004/'
    - 'https://attack.mitre.org/techniques/T1105/'
    - 'https://man7.org/linux/man-pages/man1/bash.1.html'
author: 'Salvatore Mazzaglia'
date: 2026-08-01
tags:
    - attack.execution
    - attack.t1059.004
    - attack.t1105
logsource:
    category: process_creation
    product: linux
detection:
    selection_retrieval_tool:
        CommandLine|contains:
            - 'curl '
            - 'wget '
            - 'fetch '
    selection_pipe_to_shell:
        CommandLine|contains:
            - '| sh'
            - '|sh'
            - '| bash'
            - '|bash'
            - '| zsh'
    condition: 'selection_retrieval_tool and selection_pipe_to_shell'
falsepositives:
    - >-
        Developer bootstrap instructions for internal tooling that install a command line
        client directly from an internal artefact service.
    - >-
        Container build steps in older images that install a package manager helper through
        a retrieval and pipe idiom.
level: high
license: MIT
