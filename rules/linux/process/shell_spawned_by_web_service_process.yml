title: 'Interactive Shell Spawned By A Web Service Process'
id: f6a911f9-dfb2-5dfa-b2af-d42a23fc1bb1
status: experimental
description: >-
    Detects a shell process whose parent is a web server or application server worker. This
    rule is rated critical because a web worker has no legitimate reason to start a shell in
    a normal deployment, the pattern is the defining signature of web shell execution, and
    the required response is to take the host out of service.
references:
    - 'https://attack.mitre.org/techniques/T1505/003/'
    - 'https://attack.mitre.org/techniques/T1059/004/'
    - 'https://man7.org/linux/man-pages/man1/bash.1.html'
author: 'Salvatore Mazzaglia'
date: 2026-08-01
tags:
    - attack.persistence
    - attack.t1505.003
    - attack.t1059.004
logsource:
    category: process_creation
    product: linux
detection:
    selection_web_parent:
        ParentImage|endswith:
            - '/nginx'
            - '/httpd'
            - '/apache2'
            - '/php-fpm'
            - '/synthetic-appserver'
    selection_shell_child:
        Image|endswith:
            - '/bash'
            - '/sh'
            - '/dash'
            - '/zsh'
            - '/ksh'
    condition: 'selection_web_parent and selection_shell_child'
falsepositives:
    - >-
        Deployment hooks where the application server intentionally shells out to a
        maintenance script during a release, usually only on the release host.
    - >-
        Health check probes implemented as shell one-liners in older application
        configurations.
level: critical
license: MIT
