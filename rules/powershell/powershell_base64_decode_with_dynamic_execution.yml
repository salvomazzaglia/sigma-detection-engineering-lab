title: 'PowerShell Script Block Combining Base64 Decoding With Dynamic Execution'
id: 9672b977-5075-5c56-8221-15bdedffe472
status: experimental
description: >-
    Detects script block content that decodes a base64 string and then evaluates the result
    dynamically. The fixtures use a synthetic placeholder string and contain no decodable
    payload.
references:
    - 'https://attack.mitre.org/techniques/T1027/'
    - 'https://attack.mitre.org/techniques/T1140/'
    - 'https://attack.mitre.org/techniques/T1059/001/'
    - 'https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_logging_windows'
author: 'Salvatore Mazzaglia'
date: 2026-08-01
tags:
    - attack.defense-evasion
    - attack.t1027
    - attack.t1059.001
    - attack.t1140
logsource:
    product: windows
    category: ps_script
detection:
    selection_base64_decode:
        ScriptBlockText|contains:
            - FromBase64String
            - 'Convert]::FromBase64'
            - System.Convert::FromBase64
    selection_dynamic_execution:
        ScriptBlockText|contains:
            - Invoke-Expression
            - 'IEX '
            - 'IEX('
            - '.Invoke()'
            - 'ScriptBlock]::Create'
    condition: 'selection_base64_decode and selection_dynamic_execution'
falsepositives:
    - >-
        Internal deployment modules that store a configuration template as base64 and expand
        it into a script block during installation.
    - >-
        Legacy automation that transports quoted SQL statements as base64 to avoid escaping
        problems and then evaluates the decoded text.
level: high
license: MIT
