title: 'PowerShell Script Block Containing A Download Command Pattern'
id: 25a9f459-02b5-5988-b364-6ef7e6bd5e52
status: experimental
description: >-
    Detects script block content that retrieves remote content through the common PowerShell
    download methods. The rule matches method names in logged script text, not network
    activity.
references:
    - 'https://attack.mitre.org/techniques/T1105/'
    - 'https://attack.mitre.org/techniques/T1059/001/'
    - 'https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_logging_windows'
author: 'Salvatore Mazzaglia'
date: 2026-08-01
tags:
    - attack.command-and-control
    - attack.t1105
    - attack.t1059.001
logsource:
    product: windows
    category: ps_script
detection:
    selection_download_method:
        ScriptBlockText|contains:
            - DownloadString
            - DownloadFile
            - Invoke-WebRequest
            - Invoke-RestMethod
            - Start-BitsTransfer
    selection_remote_scheme:
        ScriptBlockText|contains:
            - 'http://'
            - 'https://'
    condition: 'selection_download_method and selection_remote_scheme'
falsepositives:
    - >-
        Internal automation modules that fetch configuration manifests from an approved
        internal web service at the start of every run.
    - >-
        Package bootstrap scripts on build agents that download dependencies from an
        internal artefact repository.
level: medium
license: MIT
