title: 'PowerShell Launched By An Office-Like Application'
id: 2ecd1048-dfa2-5cd9-8485-688defae0198
status: experimental
description: >-
    Detects PowerShell whose parent process is a synthetic office application. This is the
    PowerShell-specific companion to the broader interpreter rule and is kept separate so
    that its tuning and response guidance can differ.
references:
    - 'https://attack.mitre.org/techniques/T1059/001/'
    - 'https://attack.mitre.org/techniques/T1204/002/'
    - 'https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_logging_windows'
author: 'Salvatore Mazzaglia'
date: 2026-08-01
tags:
    - attack.execution
    - attack.t1059.001
    - attack.t1204.002
logsource:
    category: process_creation
    product: windows
detection:
    selection_office_parent:
        ParentImage|endswith:
            - '\synthetic_word.exe'
            - '\synthetic_excel.exe'
            - '\synthetic_powerpoint.exe'
            - '\synthetic_outlook.exe'
    selection_powershell_child:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
    condition: 'selection_office_parent and selection_powershell_child'
falsepositives:
    - >-
        Reporting workbooks in finance that refresh data through a signed PowerShell helper
        invoked from a document macro.
    - >-
        Mail client add-ins that call PowerShell once during add-in registration after an
        office suite upgrade.
level: high
license: MIT
