title: 'PowerShell Command Modifying Privileged Group Membership'
id: 7daee763-200c-5c3f-b0c5-71873e19f969
status: experimental
description: >-
    Detects command lines that add a member to a privileged local or directory group. The
    rule complements the directory audit rules by capturing the client-side invocation,
    including cases where directory auditing is incomplete.
references:
    - 'https://attack.mitre.org/techniques/T1098/'
    - 'https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.localaccounts/add-localgroupmember'
author: 'Salvatore Mazzaglia'
date: 2026-08-01
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1098
logsource:
    category: process_creation
    product: windows
detection:
    selection_membership_command:
        CommandLine|contains:
            - Add-LocalGroupMember
            - Add-ADGroupMember
            - 'net localgroup'
            - 'net group'
    selection_privileged_group:
        CommandLine|contains:
            - 'Domain Admins'
            - 'Enterprise Admins'
            - 'Schema Admins'
            - Administrators
    condition: 'selection_membership_command and selection_privileged_group'
falsepositives:
    - >-
        Identity governance automation that grants time-bound administrative access as part
        of an approved privileged access management workflow.
    - >-
        Server build scripts that add the platform operations group to the local
        administrators group during provisioning.
level: medium
license: MIT
