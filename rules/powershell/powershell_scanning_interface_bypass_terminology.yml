title: 'PowerShell Script Block Referencing Scanning Interface Internals'
id: 345650f1-ffdc-5b0a-81bd-8ee8cb2f2932
status: experimental
description: >-
    Detects script block text that references internal type and field names belonging to the
    script scanning interface. The rule matches indicator strings only and deliberately
    contains no functional bypass technique.
references:
    - 'https://attack.mitre.org/techniques/T1685/'
    - 'https://attack.mitre.org/techniques/T1059/001/'
    - 'https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_logging_windows'
author: 'Salvatore Mazzaglia'
date: 2026-08-01
tags:
    - attack.defense-evasion
    - attack.t1685
    - attack.t1059.001
logsource:
    product: windows
    category: ps_script
detection:
    selection_scanner_internals:
        ScriptBlockText|contains:
            - AmsiUtils
            - amsiInitFailed
            - amsiContext
            - EnableScriptBlockLogging
    selection_modification_verbs:
        ScriptBlockText|contains:
            - SetValue
            - GetField
            - NonPublic
            - '::Static'
    condition: 'selection_scanner_internals and selection_modification_verbs'
falsepositives:
    - >-
        Security research and detection engineering laboratories that intentionally author
        scanner interaction test scripts on isolated hosts.
    - >-
        Endpoint tooling validation scripts that read scanning interface state to confirm
        the control is enabled before a compliance report.
level: high
license: MIT
