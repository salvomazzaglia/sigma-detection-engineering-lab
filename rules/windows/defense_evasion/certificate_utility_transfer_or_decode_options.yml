title: 'Certificate Utility Invoked With Transfer Or Decoding Options'
id: 837a9c37-9648-519e-9336-ba36b0c52370
status: experimental
description: >-
    Detects the Windows certificate utility being used with its download cache or encoding
    conversion options. Those options turn a certificate management tool into a general
    purpose file transfer and decoding utility.
references:
    - 'https://attack.mitre.org/techniques/T1105/'
    - 'https://attack.mitre.org/techniques/T1140/'
    - 'https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/certutil'
author: 'Salvatore Mazzaglia'
date: 2026-08-01
tags:
    - attack.command-and-control
    - attack.t1105
    - attack.t1140
logsource:
    category: process_creation
    product: windows
detection:
    selection_certificate_utility:
        Image|endswith: '\certutil.exe'
    selection_transfer_or_decode:
        CommandLine|contains:
            - '-urlcache'
            - '-decode'
            - '-encode'
            - '-verifyctl'
    condition: 'selection_certificate_utility and selection_transfer_or_decode'
falsepositives:
    - >-
        Certificate lifecycle automation that encodes and decodes certificate signing
        requests between binary and base64 form during renewal jobs.
    - >-
        Public key infrastructure administrators verifying certificate trust lists during
        scheduled trust store maintenance.
level: medium
license: MIT
