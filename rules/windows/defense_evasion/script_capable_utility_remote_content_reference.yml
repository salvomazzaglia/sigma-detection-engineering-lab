title: 'Script-Capable Windows Utility Referencing Remote Content'
id: b39d0736-cd9f-533f-be89-f7946124699a
status: experimental
description: >-
    Detects script-capable signed Windows utilities being pointed at a remote HTTP or HTTPS
    location. These binaries are normally used against local files, so a remote reference
    indicates the utility is being used to retrieve and execute external content.
references:
    - 'https://attack.mitre.org/techniques/T1105/'
    - 'https://attack.mitre.org/techniques/T1218/010/'
    - 'https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/windows-commands'
author: 'Salvatore Mazzaglia'
date: 2026-08-01
tags:
    - attack.command-and-control
    - attack.t1105
    - attack.t1218.010
logsource:
    category: process_creation
    product: windows
detection:
    selection_script_utility:
        Image|endswith:
            - '\mshta.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\regsvr32.exe'
            - '\rundll32.exe'
    selection_remote_scheme:
        CommandLine|contains:
            - 'http://'
            - 'https://'
    condition: 'selection_script_utility and selection_remote_scheme'
falsepositives:
    - >-
        Component registration performed by an internal deployment tool that passes a
        package URL to the registration utility during application rollout.
    - >-
        Vendor support scripts that fetch a diagnostic manifest over HTTPS from an internal
        software distribution point.
level: high
license: MIT
