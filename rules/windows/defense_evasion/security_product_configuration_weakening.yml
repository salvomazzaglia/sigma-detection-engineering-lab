title: 'Command Line Weakening Endpoint Security Product Configuration'
id: 6a181ee8-8db3-5c0d-9f2d-7e747bacacf2
status: experimental
description: >-
    Detects command lines that disable real-time protection or behaviour monitoring features
    of the endpoint security product. The rule inspects command-line metadata only and does
    not describe how to defeat any control.
references:
    - 'https://attack.mitre.org/techniques/T1685/'
    - 'https://learn.microsoft.com/en-us/powershell/module/defender/add-mppreference'
author: 'Salvatore Mazzaglia'
date: 2026-08-01
tags:
    - attack.defense-evasion
    - attack.t1685
logsource:
    category: process_creation
    product: windows
detection:
    selection_config_tool:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\cmd.exe'
            - '\reg.exe'
            - '\sc.exe'
    selection_weakening_option:
        CommandLine|contains:
            - DisableRealtimeMonitoring
            - DisableBehaviorMonitoring
            - DisableIOAVProtection
            - DisableScriptScanning
            - DisableAntiSpyware
    condition: 'selection_config_tool and selection_weakening_option'
falsepositives:
    - >-
        Approved troubleshooting sessions where support engineers temporarily disable
        real-time scanning to reproduce an application performance issue.
    - >-
        Build and test automation that disables script scanning inside short-lived
        continuous integration virtual machines.
level: high
license: MIT
