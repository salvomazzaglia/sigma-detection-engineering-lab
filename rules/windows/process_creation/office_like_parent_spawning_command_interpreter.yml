title: 'Office-Like Application Spawning A Command Interpreter'
id: e20f88a0-26ab-508e-90a0-2adefc415c67
status: experimental
description: >-
    Detects a synthetic office-suite process creating a command interpreter or script host
    child process. Document applications rarely need to launch an interpreter, so this
    parent and child combination is a high-confidence indicator of macro or template driven
    execution.
references:
    - 'https://attack.mitre.org/techniques/T1059/003/'
    - 'https://attack.mitre.org/techniques/T1204/002/'
    - 'https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon'
author: 'Salvatore Mazzaglia'
date: 2026-08-01
tags:
    - attack.execution
    - attack.t1059.003
    - attack.t1204.002
logsource:
    category: process_creation
    product: windows
detection:
    selection_office_parent:
        ParentImage|endswith:
            - '\synthetic_word.exe'
            - '\synthetic_excel.exe'
            - '\synthetic_powerpoint.exe'
            - '\synthetic_outlook.exe'
    selection_interpreter_child:
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\mshta.exe'
    condition: 'selection_office_parent and selection_interpreter_child'
falsepositives:
    - >-
        Approved document automation templates in finance or reporting teams that shell out
        to a signed helper script during month-end close.
    - >-
        Add-in installation routines that call the command interpreter once immediately
        after an office application update.
    - >-
        Software distribution packages that repackage office automation and briefly launch
        cscript to register components.
level: high
license: MIT
