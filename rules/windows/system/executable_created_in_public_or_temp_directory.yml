title: 'Executable File Created In A Public Or Temporary Directory'
id: 94c78e2e-2aab-5c13-8db5-3b538cf592b0
status: experimental
description: >-
    Detects creation of an executable or library file inside a user-writable temporary or
    public directory. On its own this is weak evidence, so the rule is rated low and is
    intended to be paired with the temporary-file-then-execution correlation rule.
references:
    - 'https://attack.mitre.org/techniques/T1105/'
    - 'https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon'
author: 'Salvatore Mazzaglia'
date: 2026-08-01
tags:
    - attack.command-and-control
    - attack.t1105
logsource:
    category: file_event
    product: windows
detection:
    selection_writable_directory:
        TargetFilename|contains:
            - '\AppData\Local\Temp\'
            - '\Windows\Temp\'
            - '\Users\Public\'
    selection_executable_extension:
        TargetFilename|endswith:
            - '.exe'
            - '.dll'
            - '.scr'
    filter_managed_update_agent:
        Image|endswith: '\synthetic_update_agent.exe'
    condition: 'selection_writable_directory and selection_executable_extension and not filter_managed_update_agent'
falsepositives:
    - >-
        Installer packages that extract their payload binaries into the per-user temporary
        directory before running the setup sequence.
    - >-
        The managed update agent staging patch binaries in the Windows temporary directory,
        which the rule filter already removes.
    - >-
        Compilers and packaging tools on developer workstations that emit build artefacts
        into a temporary scratch directory.
level: low
license: MIT
